makerspace_referrals.queue:
  path: '/admin/people/referrals'
  defaults:
    _controller: '\Drupal\makerspace_referrals\Controller\ReferralQueue::build'
    _title: 'Member recruitment referrals'
  requirements:
    _permission: 'review member referrals'
  options:
    _admin_route: true
makerspace_referrals.review:
  path: '/admin/people/referrals/{profile}/review'
  defaults:
    _form: '\Drupal\makerspace_referrals\Form\ReferralReviewForm'
    _title: 'Review member referral'
  requirements:
    _permission: 'review member referrals'
  options:
    _admin_route: true
    parameters:
      profile:
        type: entity:profile

makerspace_referrals.invite:
  path: '/referral/invite'
  defaults:
    _form: '\Drupal\makerspace_referrals\Form\ReferralInviteForm'
    _title: 'Invite a friend to join'
  requirements:
    _permission: 'send member referral invitations'

makerspace_referrals.awards:
  path: '/admin/people/referrals/awards'
  defaults:
    _controller: '\Drupal\makerspace_referrals\Controller\ReferralAwards::build'
    _title: 'Referral credits'
  requirements:
    _permission: 'review member referrals'
  options:
    _admin_route: true

makerspace_referrals.award_action:
  path: '/admin/people/referrals/awards/{award}/{op}'
  defaults:
    _form: '\Drupal\makerspace_referrals\Form\ReferralAwardActionForm'
    _title: 'Referral credit'
  requirements:
    _permission: 'administer member referral awards'
    award: \d+
    op: 'retry|reverse'
  options:
    _admin_route: true

makerspace_referrals.settings:
  path: '/admin/config/people/referrals'
  defaults:
    _form: '\Drupal\makerspace_referrals\Form\ReferralSettingsForm'
    _title: 'Member referral settings'
  requirements:
    _permission: 'administer member referral awards'
  options:
    _admin_route: true

makerspace_referrals.mine:
  path: '/user/{user}/referrals'
  defaults:
    _controller: '\Drupal\makerspace_referrals\Controller\MyReferrals::build'
    _title_callback: '\Drupal\makerspace_referrals\Controller\MyReferrals::title'
  requirements:
    _custom_access: '\Drupal\makerspace_referrals\Controller\MyReferrals::access'
    user: \d+
  options:
    parameters:
      user:
        type: entity:user

makerspace_referrals.by_referrer:
  path: '/admin/people/referrals/by-referrer'
  defaults:
    _controller: '\Drupal\makerspace_referrals\Controller\ReferralsByReferrer::build'
    _title: 'By referrer'
  requirements:
    _permission: 'review member referrals'
  options:
    _admin_route: true
